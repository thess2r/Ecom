name: ecom-production

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ecom}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecom}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [backend]

  configserver:
    image: ghcr.io/thess2r/ecom-configserver:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [backend]

  user-service:
    image: ghcr.io/thess2r/ecom-user:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
      MONGODB_URI: mongodb://${MONGO_USER:-ecom}:${MONGO_PASSWORD}@mongodb:27017/ecommerce_users?authSource=admin
      MONGODB_DATABASE: ecommerce_users
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ecom}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      configserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  product-service:
    image: ghcr.io/thess2r/ecom-product:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce}
      DB_USER: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ecom}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      configserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  order-service:
    image: ghcr.io/thess2r/ecom-order:${IMAGE_TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8080
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce}
      DB_USER: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-ecom}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SERVICES_USER_BASE_URL: http://user-service:8082
      SERVICES_PRODUCT_BASE_URL: http://product-service:8081
    ports:
      - "8083:8083"
    depends_on:
      configserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
