spring:
  application:
    name: product-service
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:productdb
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: create

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
