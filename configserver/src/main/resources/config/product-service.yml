
spring:
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5433/assanali}
    username: ${DB_USER:assanali}
    password: ${DB_PASSWORD:assanali2007}


  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true


server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
